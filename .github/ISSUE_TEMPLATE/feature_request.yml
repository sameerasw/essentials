name: Feature Request
description: Suggest a new feature for the Essentials Android app
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
type: Feature
assignees: ["sameerasw"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your interest in improving Essentials! Please fill out the form below to suggest a new feature.

        **Please don't start implementing this until the issue is labeled `approved` and assigned to you.** Pull requests for features without an approved issue will be closed. See [CONTRIBUTING.md](https://github.com/sameerasw/essentials/blob/develop/CONTRIBUTING.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see.
      placeholder: I would like to have...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
  - type: textarea
    id: affected
    attributes:
      label: Affected Areas
      description: Which existing parts of the app would this touch? (e.g. Dynamic Island, Duo, keyboard, accessibility service, a specific settings screen)
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Low - Nice to have
        - Medium - Would improve my experience
        - High - Critical for my use case
    validations:
      required: true
  - type: checkboxes
    id: willingness
    attributes:
      label: Contribution
      description: Are you willing to contribute to this feature?
      options:
        - label: I would be willing to implement this feature once it is approved and assigned to me
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or screenshots about the feature request here.