name: Bug Report
description: Report a bug in the Essentials Android app
title: "[Bug]: "
labels: ["bug"]
type: Bug
assignees: ["sameerasw"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below to help us fix the issue.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How badly does this affect you?
      options:
        - Crash
        - Broken
        - Rare
        - Minor
        - Cosmetic
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the app is affected? (optional)
      options:
        - System
        - Interface
        - Interaction
        - Display
        - Connectivity
        - Protection
        - Tools
        - Other
  - type: dropdown
    id: android-version
    attributes:
      label: Android Version
      description: What version of Android are you running?
      options:
        - Android 17 (SDK37)
        - Android 16 (SDK36)
        - Android 15 (SDK35)
        - Android 14 (SDK34)
        - Android 13 (SDK33)
        - Android 12 (SDK31/32)
        - Android 11 (SDK30)
        - Android 10 (SDK29)
        - Android 9 (SDK28)
        - Android 8 (SDK26/27)
        - Android Canary
    validations:
      required: true
  - type: dropdown
    id: oem
    attributes:
      label: Device (OEM)
      description: Who makes your device?
      options:
        - Pixel
        - Samsung
        - Motorola
        - OnePlus
        - Xiaomi
        - Oppo
        - Vivo
        - Nothing
        - Other
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      description: What device model are you using?
      placeholder: e.g., Google Pixel 8
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App Version
      description: What version of the Essentials app are you using?
      placeholder: e.g., 1.0.0
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here.