name: Issue Type

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  set-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const typeForLabel = {
              bug: 'Bug',
              enhancement: 'Feature',
              question: 'Question',
              documentation: 'Documentation',
              translations: 'Translations',
            };
            const target = typeForLabel[context.payload.label.name];
            if (!target) return;

            const current = context.payload.issue.type?.name;
            if (current === target) return;
            if (current && target !== 'Bug') return;

            await github.request('PATCH /repos/{owner}/{repo}/issues/{issue_number}', {
              ...context.repo,
              issue_number: context.issue.number,
              type: target,
            });
